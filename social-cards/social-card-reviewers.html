<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>FLMSec 2026 Call for Reviewers</title>
<style>
    :root {
        --ink: #202725;
        --paper: #f7f8f6;
        --accent: #71848a;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 1200px;
        height: 840px;
        overflow: hidden;
        background: var(--ink);
        font-family: Aptos, "Segoe UI", sans-serif;
    }

    .card {
        position: relative;
        width: 1200px;
        height: 840px;
        overflow: hidden;
        border: 16px solid var(--ink);
        background: var(--paper);
        color: var(--ink);
    }

    .top-rule {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 4px;
        background: var(--accent);
    }

    .content {
        position: relative;
        height: 100%;
        padding: 52px 62px;
        display: flex;
        flex-direction: column;
    }

    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .eyebrow,
    .status,
    .detail-label,
    .apply-lead,
    .qr-caption {
        font-size: 15px;
        font-weight: 750;
        letter-spacing: 2.2px;
        text-transform: uppercase;
    }

    .eyebrow {
        color: rgba(32, 39, 37, 0.82);
    }

    .status {
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--paper);
        padding: 9px 14px;
    }

    .main {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 372px;
        gap: 0 60px;
        align-items: center;
    }

    .intro {
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    h1 {
        font-family: Cambria, Georgia, serif;
        font-size: 84px;
        font-weight: 600;
        letter-spacing: 0;
        line-height: 0.96;
    }

    .workshop-name {
        margin-top: 22px;
        max-width: 600px;
        color: rgba(32, 39, 37, 0.66);
        font-size: 23px;
        font-weight: 600;
        letter-spacing: 0.2px;
        line-height: 1.35;
    }

    .deadline {
        display: flex;
        align-items: center;
        gap: 22px;
        margin-top: 46px;
        padding-top: 26px;
        border-top: 1px solid rgba(32, 39, 37, 0.2);
    }

    .deadline-marker {
        flex: 0 0 auto;
        width: 5px;
        height: 82px;
        background: var(--accent);
    }

    .detail-label {
        margin-bottom: 8px;
        color: rgba(32, 39, 37, 0.6);
        font-size: 13px;
    }

    .deadline-date {
        font-family: Cambria, Georgia, serif;
        font-size: 44px;
        font-weight: 700;
        line-height: 1;
    }

    .deadline-time {
        margin-top: 8px;
        color: rgba(32, 39, 37, 0.68);
        font-size: 17px;
        font-weight: 650;
    }

    .apply {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 42px 30px;
        text-align: center;
        border: 1px solid rgba(32, 39, 37, 0.14);
        border-radius: 16px;
        background: rgba(32, 39, 37, 0.035);
    }

    .apply-lead {
        color: rgba(32, 39, 37, 0.6);
        font-size: 13px;
    }

    .apply-url {
        margin-top: 10px;
        color: var(--ink);
        font-family: Consolas, "Cascadia Code", "SFMono-Regular", monospace;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.2px;
        white-space: nowrap;
    }

    .qr-frame {
        margin-top: 26px;
        width: 290px;
        height: 290px;
        border: 1px solid rgba(32, 39, 37, 0.22);
        background: var(--paper);
        padding: 12px;
    }

    .qr-frame img {
        display: block;
        width: 100%;
        height: 100%;
    }

    .qr-caption {
        margin-top: 18px;
        color: var(--ink);
        font-size: 13px;
    }

    .bottom-rule {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 4px;
        background: var(--accent);
    }
</style>
</head>
<body>
<div class="card">
    <div class="top-rule" aria-hidden="true"></div>

    <main class="content">
        <header class="header">
            <div class="eyebrow">NeurIPS 2026 Workshop</div>
            <div class="status">Reviewer Applications Open</div>
        </header>

        <div class="main">
            <section class="intro">
                <h1>Call for<br>Reviewers</h1>
                <div class="workshop-name">Foundations of Language Model Security: Theory, Practice, and Fundamental Limits</div>

                <div class="deadline">
                    <div class="deadline-marker" aria-hidden="true"></div>
                    <div>
                        <div class="detail-label">Apply by</div>
                        <div class="deadline-date">August 21, 2026</div>
                        <div class="deadline-time">23:59 AoE (Anywhere on Earth)</div>
                    </div>
                </div>
            </section>

            <aside class="apply" aria-label="Reviewer application">
                <div class="apply-lead">Apply at</div>
                <div class="apply-url">https://flmsec.github.io/</div>
                <div class="qr-frame"><img src="reviewer-application-qr.png" alt="QR code linking to the reviewer application form"></div>
                <div class="qr-caption">Scan to apply</div>
            </aside>
        </div>
    </main>

    <div class="bottom-rule" aria-hidden="true"></div>
</div>
</body>
</html>
